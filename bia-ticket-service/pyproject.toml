[project]
name = "bia-ticket-service"
version = "0.1.0"
description = "One metrics engine for BIA engineering tickets, served to Claude over MCP and to Make.com/dashboards over REST."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",          # MCP Python SDK (v2: MCPServer)
    "httpx>=0.27",          # calls the BIA API
    "python-dotenv>=1.0",   # reads .env
    "uvicorn>=0.30",        # HTTP mode
    "tzdata",               # IST time zone data on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bia_service"]
